# Minimal conda environment for building & running ksgpu.
#
#   - This is probably not the environment you want! It's a barebones
#     ksgpu-only env. If you're building ksgpu as part of a larger project,
#     then you'll want a larger conda env.
#
#     For example, if you're building the 'pirate' library for CHIME/CHORD, then
#     use pirate/environment_minimal.yml or pirate/environment_dev.yml instead.
#
#   - We rely on the SYSTEM cuda toolkit (`nvcc`, cuda headers) and the
#     SYSTEM host compiler (gcc/g++). Everything else is conda-installed.
#
#   - `pipmake` (the pip build backend) is not on conda-forge, so it's NOT
#     listed here; instead, `pip install pipmake` from PyPI in the build steps
#     below, then build with --no-build-isolation. For ksgpu that flag is not
#     strictly necessary (all its build deps are on PyPI) -- it's cautious: it
#     forces the build to use the conda pybind11/numpy (ABI-consistent with the
#     runtime env) instead of pip-fetched copies.
#
# Usage (run from the ksgpu/ checkout, or adjust paths):
#
#   conda env create -n ENV_NAME -f environment.yml
#   conda activate ENV_NAME
#   pip install pipmake
#   pip install --no-build-isolation -v -e .

name: ksgpu
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - setuptools
  - editables    # required by pipmake for editable installs

  # Build-time headers
  - pybind11
  - numpy

  # Runtime
  - cupy         # ksgpu Python code imports cupy.cuda
